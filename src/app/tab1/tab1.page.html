<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <div class="ChatBoxTitle">
        <div class="titleOne">ChatBox AI</div>
        <div class="titleTwo">
          <ion-icon aria-hidden="true" name="camera"></ion-icon>
        </div>
      </div>
      <div class="searchChatList">
        <ion-searchbar show-clear-button="focus" placeholder="Search or start a new chat" value=""
          (ionInput)="handleSearch($event)" [debounce]="300"></ion-searchbar>
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="chatBoxAIContainer">
    <div class="chatListData">
      <ion-list lines="inset">
        @for(item of filteredItems; track item.id){
        <ion-item button detail="false">
          <ion-avatar slot="start">
            <img src="/assets/icon/avatarIcon1.png" />
          </ion-avatar>
          <ion-label>
            <h2>{{item.name}}</h2>
            <p>{{item.category}}</p>
          </ion-label>
          <ion-note slot="end" color="medium">{{item.id}}</ion-note>
        </ion-item>
        } @empty {
        <ion-item lines="none">
          <ion-label class="ion-text-center ion-padding">
            <p>No results found matching your search.</p>
          </ion-label>
        </ion-item>
        }
      </ion-list>
    </div>
    <div class="chatAddList" (click)="goToContactList()">
      <ion-icon aria-hidden="true" name="chatbox"></ion-icon>
    </div>
  </div>

</ion-content>
